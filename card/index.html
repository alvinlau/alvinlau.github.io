<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alvin Lau</title>
<meta name="description" content="Alvin Lau: Discord communities and the software behind them. Vancouver, Canada.">
<link rel="canonical" href="https://alvinlau.ca/card">
<style>
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --text: #1b1d22; --muted: #5b616e;
    --line: #e3e1da; --accent: #5865f2; --accent-ink: #ffffff; --accent-soft: #eceefe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121317; --surface: #1b1d23; --text: #ecedf0; --muted: #a3a8b3;
      --line: #2c2f37; --accent: #7c86ff; --accent-ink: #0f1020; --accent-soft: #23264a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  main { width: 100%; max-width: 420px; padding: 40px 16px; text-align: center; }
  .art { width: 120px; height: 120px; margin: 0 auto 20px; display: block; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .links { display: grid; gap: 10px; }
  .links a {
    display: block; padding: 13px 18px; border-radius: 10px;
    font-weight: 600; text-decoration: none;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
  }
  .links a.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  footer { margin-top: 28px; font-size: 14px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <!-- Placeholder graphic: swap for a photo or mascot later. -->
  <svg class="art" viewBox="0 0 120 120" role="img" aria-label="AL monogram">
    <circle cx="60" cy="60" r="58" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
    <text x="60" y="73" text-anchor="middle" font-size="40" font-weight="700" fill="var(--accent)" font-family="system-ui, sans-serif">AL</text>
  </svg>
  <h1>Alvin Lau</h1>
  <p class="sub">Communities and the software behind them.<br>Vancouver, Canada</p>
  <nav class="links">
    <a class="primary" href="/#contact">Get in touch</a>
    <a href="/#services">Services</a>
    <a href="/#work">Work</a>
    <a href="/#about">About</a>
  </nav>
  <footer><a href="/">alvinlau.ca</a></footer>
</main>
</body>
</html>
